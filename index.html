<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Martin de Porres FC | Academia y Equipo de Futbol</title>
<meta name="description" content="San Martin de Porres FC, academia y equipo de futbol con formacion deportiva, disciplina, categorias, historia, galeria y contacto por WhatsApp.">
<style>
:root{
  --bg:#061325; --bg2:#0a1c36; --card:rgba(255,255,255,.06); --text:#f7f9fc; --muted:rgba(247,249,252,.76);
  --gold:#d7b05d; --gold2:#f3d68c; --line:rgba(255,255,255,.12); --shadow:0 18px 50px rgba(0,0,0,.35); --radius:22px; --max:1200px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at top left, rgba(215,176,93,.18), transparent 26%), radial-gradient(circle at top right, rgba(255,255,255,.08), transparent 24%), linear-gradient(180deg,var(--bg),var(--bg2));min-height:100vh}
a{color:inherit;text-decoration:none} img{max-width:100%;display:block}
.container{width:min(var(--max),calc(100% - 32px));margin:0 auto}
.header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(6,19,37,.72);border-bottom:1px solid rgba(255,255,255,.08)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:44px;height:44px;object-fit:contain;flex:0 0 auto}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text strong{font-size:1rem;letter-spacing:.2px}
.brand-text span{font-size:.84rem;color:var(--muted)}
.nav{display:flex;align-items:center;gap:18px}
.nav a{color:var(--muted);font-size:.95rem;font-weight:600;transition:color .2s ease}
.nav a:hover{color:var(--text)}
.menu-btn{display:none;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:10px 12px;border-radius:12px;font-size:1rem;cursor:pointer}
.hero{padding:52px 0 34px}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:30px;align-items:center;min-height:calc(100vh - 90px)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);margin-bottom:18px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 6px rgba(243,214,140,.13)}
h1{margin:0 0 16px;font-size:clamp(2.5rem,6vw,5rem);line-height:.95;letter-spacing:-0.04em;max-width:12ch}
.lead{margin:0 0 28px;color:var(--muted);font-size:1.06rem;line-height:1.75;max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 20px;border-radius:14px;font-weight:700;border:1px solid transparent;transition:transform .2s ease, box-shadow .2s ease, background .2s ease;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1c1c1c;box-shadow:0 12px 26px rgba(215,176,93,.23)}
.btn-secondary{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--text)}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stat strong{display:block;font-size:1.2rem;margin-bottom:6px}
.stat span{display:block;color:var(--muted);line-height:1.45;font-size:.92rem}
.hero-visual{position:relative;border-radius:30px;min-height:560px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)), radial-gradient(circle at top, rgba(215,176,93,.18), transparent 28%), linear-gradient(145deg,#10294d,#071325);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.crest-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:28px}
.crest-card{width:min(380px,100%);aspect-ratio:1 / 1.15;border-radius:28px;border:1px solid rgba(215,176,93,.24);background:radial-gradient(circle at top, rgba(243,214,140,.16), transparent 35%), rgba(6,19,37,.72);box-shadow:0 24px 60px rgba(0,0,0,.35);backdrop-filter:blur(10px);display:grid;place-items:center;text-align:center;padding:24px}
.crest-card img{width:170px;height:auto;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.crest-card h2{margin:0;font-size:1.2rem;letter-spacing:.3px}
.crest-card p{margin:10px 0 0;color:var(--muted);line-height:1.6;font-size:.95rem;max-width:28ch}
.floating-badge{position:absolute;top:18px;right:18px;padding:12px 14px;border-radius:14px;background:rgba(7,19,37,.78);border:1px solid rgba(215,176,93,.3);color:var(--text);font-weight:700;font-size:.92rem}
.block{padding:24px 0 8px}
.section-title{margin:0 0 10px;font-size:clamp(1.8rem,3vw,2.6rem);letter-spacing:-0.03em}
.section-lead{margin:0 0 26px;color:var(--muted);line-height:1.75;max-width:70ch}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:1.18rem}
.card p{margin:0;color:var(--muted);line-height:1.7}
.history-list{display:grid;gap:14px;margin-top:18px}
.history-item{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.history-number{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#161616;font-weight:800}
.history-item strong{display:block;margin-bottom:4px;font-size:1rem}
.history-item span{color:var(--muted);line-height:1.55;font-size:.94rem}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.category{background:radial-gradient(circle at top, rgba(243,214,140,.12), transparent 30%), rgba(255,255,255,.05);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.category .tag{display:inline-block;margin-bottom:12px;padding:8px 10px;border-radius:999px;background:rgba(215,176,93,.14);border:1px solid rgba(215,176,93,.24);color:var(--gold2);font-size:.84rem;font-weight:700}
.category h3{margin:0 0 8px;font-size:1.08rem}
.category p{margin:0;color:var(--muted);line-height:1.65;font-size:.94rem}
.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gallery-item{min-height:220px;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.05)), linear-gradient(135deg,#0f2750,#071325);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px;display:flex;align-items:flex-end}
.gallery-item::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top left, rgba(243,214,140,.18), transparent 25%), radial-gradient(circle at bottom right, rgba(255,255,255,.08), transparent 22%);pointer-events:none}
.gallery-item .label{position:relative;z-index:1;background:rgba(7,19,37,.72);border:1px solid var(--line);padding:10px 12px;border-radius:14px;width:fit-content;backdrop-filter:blur(8px)}
.gallery-item .label strong{display:block;margin-bottom:3px}
.gallery-item .label span{color:var(--muted);font-size:.9rem}
.contact-box{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:stretch}
.contact-panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.contact-panel p{color:var(--muted);line-height:1.75;margin:0 0 20px}
.contact-actions{display:flex;flex-wrap:wrap;gap:12px}
.whatsapp-btn{display:inline-flex;align-items:center;gap:10px;background:#25D366;color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;box-shadow:0 12px 24px rgba(37,211,102,.18)}
.mini-info{display:grid;gap:12px;margin-top:16px}
.mini-row{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);line-height:1.5}
.footer{margin-top:26px;padding:24px 0 34px;border-top:1px solid rgba(255,255,255,.09)}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.social{display:flex;gap:12px;flex-wrap:wrap}
.social a{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);font-size:.92rem;font-weight:700}
.social a:hover{color:var(--text)}
.float-wa{position:fixed;right:18px;bottom:18px;z-index:60;background:#25D366;color:white;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;box-shadow:0 16px 30px rgba(37,211,102,.28);font-size:1.5rem;border:3px solid rgba(255,255,255,.12)}
@media (max-width:980px){
  .hero-grid,.grid-2,.contact-box{grid-template-columns:1fr}
  .cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding-top:30px}
  .hero-visual{min-height:460px}
}
@media (max-width:700px){
  .menu-btn{display:inline-flex}
  .nav{display:none;width:100%;flex-direction:column;align-items:flex-start;gap:14px;padding:14px 0 2px}
  .nav.open{display:flex}
  .hero-stats{grid-template-columns:1fr}
  .cat-grid,.gallery-grid{grid-template-columns:1fr}
  .header-inner{flex-wrap:wrap}
  .hero{padding:24px 0 22px}
  .hero-visual{min-height:390px}
}
</style>
</head>
